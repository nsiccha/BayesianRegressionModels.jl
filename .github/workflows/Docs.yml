name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - ns/devibe
    tags: '*'
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        # BRM's only nsiccha-org runtime dep is StanBlocks; the registered
        # version in General can be stale relative to BRM's expectations
        # and cause precompile asserts during `using BayesianRegressionModels`.
        # Clone the public source and Pkg.develop in a single batch
        # (see /ci §5). HTMXObjects is private and not needed by the
        # docs build — see make.jl's conditional theme install.
        run: |
          git clone -b dev https://github.com/nsiccha/StanBlocks.jl.git
          julia --project=docs -e 'using Pkg; Pkg.develop([
            PackageSpec(path=pwd()),
            PackageSpec(path="StanBlocks.jl"),
          ]); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
