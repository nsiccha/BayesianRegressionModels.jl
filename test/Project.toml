[sources.ReactiveKernels]
url = "https://github.com/nsiccha/ReactiveKernels.jl"
# RK main: contains db4f16aa (lower Cholesky, graph allocation bounds,
# native prepared-callback Reverse), e0930dcd (a declared-array element is a
# scalar location summand), 712c227b (vector-of-vectors nested-plate
# observations), 9e425eda (LogDensity laws, link families, per-index
# arithmetic and derived responses in nested plate cells), 628769da +
# ea596e50 (built graphs carry no bound row count), 683b8342 (one source
# always lowers to one program) and ed87ceef (a proven scalar response
# location stays scalar; 0f7d2521 gives other locations their rows once,
# without a ones vector), 83707d4d (closure captures in plate cells and
# scan steps, used instead of Ref operands; bed5d467 deprecates the Ref
# spelling), ecf99453 (hidden bound operands packed into one AD context),
# 1603d87a (sampler queries that retain pointwise densities from the reverse
# sweep), 5c2b80d5 (authored predictor names), 281933141 (positional
# level axes over pool definitions), f67bd182 (prepared HVPs, observation
# queries and pushforwards for Gaussian NLME), 659a6e8b (joint matrix columns
# and two-axis priors), cb3a0db7 (in-place native reverse column reads),
# 7eafe9ba (whole-pool level reads), fbd0aef0 + 2503ede6 (arrays-per-index
# `@plate for` cells), d702209e (shared cell work evaluated once), ddb68802
# (Gaussian observation arguments), fa23fe7f (in-place column reads of a
# row-gathered joint monotonic output), 609c7a9d (one composed plate cell
# query per subject), a2268e47 (compact selected-coordinate cell gradients),
# 68a77b03 (a design binds without its conditioned response values),
# dad59972 (censored and truncated responses bind absent too), ae731d3f +
# fe85d9f6 (a location over a computed design keeps its authored name),
# 60ff95f1 (sampled seeds and steps in plate-cell scans) and cc50dae0 /
# 3581f5a8 (observed carried arrays in `@scan`, top level and per plate cell).
# 6c7e18af adds c4008d62 (a per-cell `@rkppl` submodel may hold a `@scan`,
# its returned carried array observed in place), and contains ce48fc77
# (`rk_ode_rk45_tol`), 9bef9c04 (per-row provider-law subject cells) and
# fef26022 (queries skip unread plate outputs). d92d6677 adds ac01d1f1d +
# 2512d6b1c (posterior-predictive draws: `prepare_predictive`, and
# `predictive_node` / `predictive_targets` for a caller's own vectorized cut;
# test/rk_predictive.jl). 9af9b197 adds 276428589 (kernels built for another
# package's module while a package image is generated: `build_kernel` and
# `prepare_sampler` in a downstream precompile workload; snag
# rkppl-build-kern-4607ff90), and contains a89e08381 (the `bind_data`
# structural cache) and 74e415976 (a computed partition drives a per-cell loop).
# de89298a adds 7ba63ea6e (`frozen_values`, `bind_data(…; frozen)`,
# `lower_rkppl(…; frozen)`: data-only definitions bound frozen by value;
# test/rk_fitted_state.jl) and 28f8896d8 (a frozen design may omit an input
# of strings); snag rkppl-bind-froze-da223711.
# 9f5d1e7de adds 6027d63bd (position-batched readers keep plate cell results
# and the `reduce(vcat, cells)` flatten in lane slots; snag
# position-batched-cc11130b). fd92ced46 adds 207b0e056 (a branch on
# `eltype(cells) <: Number` keeps that slot, which BRM's emitted flatten
# needs; snag type-constant-la-902b10ce). 356142a62 adds `jax_source`
# (666bb505f) and its host-side `prepare_data` (888bdfd42), which
# test/rk_jax.jl uses. 911df2b96 adds 39185dd24 (guards over caller
# literals are decided while JAX traces; snag jax-source-liter-a9e6219e).
# 38265d407 adds 711b2034d (`reshape` with a `Colon` dimension translates;
# snag jax-source-resha-959acdfb). 1d5b163fe adds 65bdd443f (a gather by a
# model-level index reads the gathered value whole: a model-scope `vcat` of
# `car` returns lowers; snag lower-a-brm-emit-2136dcc0), and contains
# 26d24ab55 (in-cell `MvNormal` observations), 965564845 (dotted cell
# latents) and a987c279a (LogExpFunctions 1.0.2 admitted). 6ab16f510 adds
# cf9dde7ca (`prepare_ad_third`, third-order contractions D³f[v, v, ·], which
# the per-unit Laplace gradient takes; snag prepared-third-o-1e44dcc9).
# 8d29971f2 adds d5b22ec53 (a native matrix product with a non-strided
# operand, such as a compact cell's row of a correlated group block, runs
# an owned loop instead of LinearAlgebra's tiled generic `mul!`: ~2.8 KB
# instead of ~89 KB per compact-cell gradient, which brm_svi_fit calls once
# per batched subject; snag compact-cell-gra-ebf0a114). 0470e9e13 contains
# 8d29971f2 and adds fe5c508c2 (a `@plate` cell latent's law reads a model
# value at the index, `m[i]`; snag rkppl-cell-laten-b18e668a).
# b5e4760fc contains 0470e9e13 and adds ae5aca6ba (prepared pullbacks and
# pushforwards over several WANT ports in one sweep, which the structured
# Laplace's non-affine fallback takes; snag ad-pullback-push-6f576925).
# bf8040f16 contains b5e4760fc and adds 6316fe45d (that pullback over
# several ports differentiates under plain Enzyme Reverse when the ports read
# constant design matrices; snag several-port-pul-e6344d44). 1c14fc131
# contains bf8040f16 and adds 0e96da576 (one joint `@plate` cell latent per
# index, which `T::shares(total)` emits; snag rkppl-per-index-5e9df9fe).
# e32d442c6 contains 1c14fc131 and adds d35aee6cd (ReactiveKernels 0.1.2,
# ReactiveKernelsPPL 0.1.1: a `@plate` output whose cells hold vectors is one
# vector per cell, so model-scope `sum(cnt)`, `sum(cnt[k])` and `cnt[g]` read
# it; snag summing-a-plate-eba2648d).
# The nested ReactiveKernelsPPL / ReactiveKernelsDistributionKernels
# packages have no standalone repos, so they stay develop-path-only via
