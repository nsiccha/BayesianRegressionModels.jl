[sources.StanBlocks]
url = "https://github.com/nsiccha/StanBlocks.jl"
# Descriptor outputs carry their value shape as `dims`; non-finite literals render; `weighted`
# takes a censored/truncated/interval_censored family; an exchangeable ordered prior re-draws
# as the sorted iid draw. 82a954da adds observed scans (a carried array that is bound data)
# and per-cell scan lengths in plate cells; 4ee6e0e8 also through a do-cell parameter that
# shadows its data name; 2f5b6203 stores integer step locals of nested scans; e67bc314 lets
# a called `@slic` submodel hold a latent or observed `@scan` (snag scan-inside-call-2ea17cef);
# d3483f11 lets a plate cell's group be that scan's observed keyword (snag
# submodel-scan-ob-50a09edb); 897557c takes `interval_censored`'s interval by keyword and
# refuses a combinator's unknown keyword; 204e5a7 lists typed `=` in `stan_descriptor`;
# 94e414bb lets a `ValueFamily` (BRM's generated `MixtureModel` family) be the base family
# of `weighted` / `truncated` / `censored` / `interval_censored`, with CDF companions;
# b233afbc evaluates every descriptor input/output bound as `constraint_values`;
# c7293b88 evaluates Stan's vectorised builtins elementwise there, so a per-axis
# `fmax(0.0, rho_lower_…)` floor reports one bound per coordinate; b97fc5a6 reads shared
# scan arguments once per step; c4671eb's values-free `maybecv(:y)` holds out an
# observation with no values given a fit (BRM's forecast replay). fd91d0c names a plate's
# Stan values after their own names (no `__pl_mem_1` suffix) and adds `stan_interface`;
# 785edf4 describes tuple descriptor entries by their `fields`; a57951eb lets a plate cell
# bind a matrix local; c9504e99 ingests a `Vector{Matrix}` data value as a `RaggedMatrix`
# whose `X[g]` is the g-th matrix in a plate cell.
# f5e4650 adds Stan's `sum_to_zero_*` transforms (8e57a83) and `head`/`tail`/
# `reverse` (359844e), which `T::shares(total)` cell latents call.
# ffbaff09 (StanBlocks 0.2.2) selects several groups of a ragged value, `rv[idx]`,
# and sums its groups elementwise, `sum(rv)` (snag selecting-severa-027a8191), which
# BRM's model-scope reads of a ragged plate output pass through.
# 9a4fb3a6 (StanBlocks 0.2.6) draws a `truncated` value whatever mass its window
# holds: after 100 misses it inverts the base CDF on the window (snag
# truncated-rng-re-bd555cae), which BRM's omitted truncated responses and `_gen`
# draws call.
# 566bbc0f (StanBlocks 0.2.7) adds `restricted(family, args...; lower, upper)`:
# the bounds go on the declaration and the family keeps its plain kernel (snag
# in-slic-declare-996328e0), which SBBRMI emits for every prior bound.
# 359a4fae (StanBlocks 0.2.8): native explicit-total Dirichlet-multinomial.
# 02a93f48 (StanBlocks 0.2.10) serializes exact infinite bound data for
# BridgeStan, including mixed censored and detected observations.
# ab3960bb (StanBlocks 0.2.12) registers stable hypot and its Base callable.
# fac3385a (StanBlocks 0.2.14) supplies stable lower-truncated LogNormal
# moments and both log-CDF tails for ordinary distribution statistics.
# 0b42d636 (StanBlocks 0.2.18) implements segment in @juliacompat
# helpers, used by the native GMRF normalized sparse density.
# 009f4180 (0.2.19) adds indexed /= for its sparse solve and prior RNG.
# 61fa161f (0.2.20) gives cell-owned bindings explicit lexical local scope.
# ef55b84f (0.2.21) predicts upper-only intervals with their response omitted.
# b43fc26d (0.2.24) predicts censored responses whose bound is the omitted response.
# dba65366 (0.2.25) preserves keyword labels when a plate renames its
# inputs, including BRM component calls whose formal and actual names match.
rev = "dba6536683e8c226f2e74823856d0d85e7ad02a2"

